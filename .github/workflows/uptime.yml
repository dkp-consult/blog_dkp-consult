name: uptime

# External probe: runs on GitHub's runners, not on the VPS it watches (#9).
on:
  schedule:
    # Une fois par heure, à la minute 17 : GitHub retarde surtout les crons du début d'heure.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# One probe at a time, so two runs never race on the saved state.
concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # The last known state lives in the Actions cache. Caches are immutable,
      # so each change is saved under a new key and the prefix restores the
      # most recent one.
      - uses: actions/cache/restore@v6
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-

      - id: probe
        run: .github/scripts/uptime.sh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # Saved only on a change: the next runs keep restoring it, which also
      # keeps it clear of the 7-day eviction.
      - if: steps.probe.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}
